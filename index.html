<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product preview card component</title>
    <meta name="description" content="A product preview card component." />
    <link rel="icon" type="image/png" href="/favicons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Product preview card component" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/src/scss/main.scss" />
    <meta property="og:title" content="Product preview card component" />
    <meta property="og:description" content="A product preview card component." />
    <meta
      property="og:image"
      content="https://vlrnsnk.github.io/product-preview-card-component/og-image.png"
    />
    <meta property="og:url" content="https://vlrnsnk.github.io/product-preview-card-component/" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="page">
    <main class="page__content">
      <article class="product-card">
        <picture class="product-card__picture">
          <source media="(width >= 48rem)" srcset="/src/assets/images/image-product-desktop.jpg" />
          <img
            class="product-card__image"
            src="/src/assets/images/image-product-mobile.jpg"
            alt="Gabrielle Essence Eau De Parfum"
          />
        </picture>
        <div class="product-card__content">
          <p class="product-card__category">Perfume</p>
          <h1 class="product-card__title">Gabrielle Essence Eau De Parfum</h1>
          <p class="product-card__description">
            A floral, solar and voluptuous interpretation composed by Olivier Polge,
            Perfumer-Creator for the House of CHANEL.
          </p>
          <span class="product-card__price">$149.99</span>
          <s class="product-card__original-price">$169.99</s>
          <button type="button" class="button product-card__button">
            <img class="button__icon" src="/src/assets/images/icon-cart.svg" alt="" />
            Add to Cart
          </button>
        </div>
      </article>
    </main>
  </body>
</html>
